name: Actualiser les offres France Travail

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
# Pas de déclencheur `push` : le commit produit par ce workflow ne le relance pas.

permissions:
  contents: write

concurrency:
  group: actualisation-france-travail
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Tester l'authentification et l'API Offres d'emploi v2
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python scripts/verifier_france_travail.py

      - name: Générer le jeu d'offres courant
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python scripts/generer_offres_france_travail.py

      - name: Publier uniquement le JSON France Travail
        run: |
          git add -- data/offres-france-travail.json
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée France Travail à publier."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualise les offres France Travail"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
